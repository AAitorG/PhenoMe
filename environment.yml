# PhenoMe - Reproducible environment
# Create with: conda env create -f environment.yml
# Activate with: conda activate phenome

name: phenome
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Python 3.13 (latest stable; supports 3.11+)
  - python=3.13

  # Numerical computing (pinned for reproducibility)
  - numpy=2.4.2
  - scipy=1.17.1
  - pandas=3.0.0
  - scikit-learn=1.8.0

  # Image processing & array ops
  - scikit-image=0.26.0
  - h5py=3.15.1
  - pillow=12.1.1
  - tifffile=2025.12.20

  # Visualization
  - matplotlib=3.10.8
  - plotly=6.5.0

  # UI & interactivity
  - ipywidgets=8.1.7
  - ipykernel=7.2.0

  # Utilities
  - joblib=1.5.3
  - tqdm=4.67.3

  # Package management (required for pip: subsection below)
  - pip=25.0

  # PyTorch (version-locked; source: pypi for flexibility)
  - pip:
    # Editable install of phenome
    - -e .
    # Jupyter stack (matches pyproject [notebook]; primary interface for notebooks)
    - jupyterlab==4.5.6
    - nbformat==5.10.4
    - jupyterlab_widgets==3.0.16
    # Core deep learning (pinned for reproducibility)
    - torch==2.10.0
    - torchvision==0.25.0
    # Image & video processing
    - opencv-python==4.13.0.92
    # UI
    - anywidget==0.9.21


# ============================================================================
# OPTIONAL DEPENDENCIES (uncomment to enable)
# ============================================================================

