# PhenoMe — GPU-oriented Conda environment
# CUDA availability depends on the torch wheel pip installs for your platform.
#
# From repo root: conda env create -f envs/environment-gpu.yml
# Activate: conda activate phenome-gpu

name: phenome-gpu
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12

  - numpy=2.4.2
  - scipy=1.17.1
  - pandas=3.0.0
  - scikit-learn=1.8.0

  - scikit-image=0.26.0
  - h5py=3.15.1
  - pillow=12.1.1
  - tifffile=2025.12.20

  - matplotlib=3.10.8
  - plotly=6.5.0

  - ipywidgets=8.1.7
  - ipykernel=7.2.0

  - joblib=1.5.3
  - tqdm=4.67.3

  - pip>=25.0

  - pip:
    - -e ..
    - jupyterlab==4.5.6
    - nbformat==5.10.4
    - jupyterlab_widgets==3.0.16
    - torch==2.12.0
    - torchvision==0.27.0
    - opencv-python==4.13.0.92
    - anywidget==0.9.21
    - umap-learn==0.5.11
    - dcor==0.7
    - "torchdr>=0.1,<0.5"
    - kaleido==1.3.0
    - "nibabel>=5.2.0,<6"
