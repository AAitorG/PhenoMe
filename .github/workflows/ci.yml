name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  platforms:
    name: lint-and-smoke (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # gitleaks-action requires a paid license on organization repositories.
      # The open-source CLI does not. Version matches .pre-commit-config.yaml.
      - name: Run Gitleaks
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version=8.30.1
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) asset="gitleaks_${version}_linux_x64.tar.gz" ;;
            Linux-aarch64) asset="gitleaks_${version}_linux_arm64.tar.gz" ;;
            Darwin-arm64) asset="gitleaks_${version}_darwin_arm64.tar.gz" ;;
            Darwin-x86_64) asset="gitleaks_${version}_darwin_x64.tar.gz" ;;
            *) echo "unsupported platform $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check phenome tests

      - name: Ruff format (check only)
        run: python -m ruff format phenome tests --check

      - name: Mypy
        run: python -m mypy phenome

      - name: Dependency compatibility smoke
        run: python -m pytest

  lint-and-smoke:
    name: lint-and-smoke
    needs: platforms
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform to pass
        run: test "${{ needs.platforms.result }}" = "success"
