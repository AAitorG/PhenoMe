name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check phenome

      - name: Ruff format (check only)
        run: python -m ruff format phenome --check

      - name: Mypy
        run: python -m mypy phenome

      - name: Smoke import
        run: python -c "from phenome import PhenoMe; assert PhenoMe is not None; print('import_ok')"
